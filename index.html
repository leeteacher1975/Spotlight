<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZA2030 우리 팀의 핵심 요소</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root {
    --bg: #f2e9d8;
    --card: #fffdf9;
    --ink: #3a2f22;
    --ink-soft: #7a6c58;
    --line: #e3d5ba;
    --accent: #0069b4;
    --accent-ink: #ffffff;
    --note-bg: #fffaf0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 32px 20px 60px; }

  header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-bottom: 8px; }
  .zeiss-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--accent); color: var(--accent-ink);
    font-weight: 700; font-size: 13px; letter-spacing: .03em;
    padding: 6px 12px; border-radius: 999px;
  }
  h1 { font-size: 26px; margin: 4px 0 2px; font-weight: 800; }
  .sub { color: var(--ink-soft); font-size: 14px; margin: 0 0 20px; }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-left: auto; }

  button {
    font-family: inherit; cursor: pointer; border: none; border-radius: 10px;
    font-weight: 600; font-size: 14px; padding: 9px 16px; transition: transform .05s ease, opacity .15s ease;
  }
  button:active { transform: scale(.97); }
  .btn-outline { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { opacity: .9; }
  .btn-ghost { background: transparent; color: var(--ink-soft); padding: 4px 8px; font-size: 12px; }
  .btn-ghost:hover { color: var(--accent); }
  .btn-danger { background: #b3402f; color: #fff; }

  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
    margin-top: 20px;
  }
  @media (max-width: 980px) { .board { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 620px) { .board { grid-template-columns: 1fr; } }

  .col {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    min-height: 220px;
  }
  .col-head .icon { width: 52px; height: auto; display: block; }
  .col-head h2 { font-size: 17px; margin: 6px 0 2px; font-weight: 800; }
  .col-head .kr { font-size: 12.5px; color: var(--ink-soft); font-weight: 600; margin-bottom: 6px; }
  .col-desc { font-size: 12.5px; color: var(--ink-soft); border-top: 1px dashed var(--line); border-bottom: 1px dashed var(--line); padding: 8px 0; margin-bottom: 10px; }

  .add-btn { width: 100%; margin-bottom: 12px; }
  .add-btn.mine { background: #fff; color: var(--accent); border: 1px solid var(--accent); }

  .notes { display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .note {
    background: var(--note-bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13.5px;
    position: relative;
  }
  .note.mine { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .note .meta { font-weight: 700; font-size: 12.5px; margin-bottom: 4px; display: flex; justify-content: space-between; gap: 6px; }
  .note .meta .who { color: var(--ink); }
  .note .meta .team { color: var(--ink-soft); font-weight: 600; }
  .note .reason { white-space: pre-wrap; word-break: break-word; }
  .note .actions { margin-top: 6px; display: flex; gap: 8px; justify-content: flex-end; }
  .empty { color: var(--ink-soft); font-size: 12.5px; text-align: center; padding: 20px 0; }

  /* modal */
  .overlay {
    position: fixed; inset: 0; background: rgba(58,47,34,.45);
    display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--card); border-radius: 16px; padding: 22px; width: 100%; max-width: 420px;
    border: 1px solid var(--line);
  }
  .modal h3 { margin: 0 0 4px; font-size: 18px; }
  .modal .pillar-tag { display: inline-block; font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 12px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12.5px; font-weight: 700; color: var(--ink-soft); margin-bottom: 4px; }
  .field input, .field textarea {
    width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line);
    font-family: inherit; font-size: 14px; background: #fff; color: var(--ink);
  }
  .field textarea { resize: vertical; min-height: 80px; }
  .field .count { text-align: right; font-size: 11px; color: var(--ink-soft); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
  .error-msg { color: #b3402f; font-size: 12.5px; margin: -4px 0 10px; min-height: 16px; }

  footer { text-align: center; color: var(--ink-soft); font-size: 12px; margin-top: 40px; }
  .footer-admin { background: none; border: none; color: var(--ink-soft); font-size: 11px; text-decoration: underline; cursor: pointer; margin-top: 6px; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .25s ease; z-index: 100;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <span class="zeiss-chip">ZEISS · ZA2030</span>
      <div class="toolbar">
        <button class="btn-outline" id="csvBtn">CSV 다운로드</button>
      </div>
    </header>
    <h1>우리 팀 성공의 핵심 요소</h1>
    <p class="sub">ZA2030의 4가지 전략 축 중, 우리 팀의 성공에 가장 중요하다고 생각하는 요소 <b>하나</b>를 선택하고 이유를 남겨주세요. 소속 팀 이름과 함께 기록되며, 다른 팀도 같은 화면을 함께 사용합니다. (1인 1건, 본인이 남긴 글은 직접 수정·삭제할 수 있습니다)</p>

    <div class="board" id="board"></div>

    <footer>
      © <span id="year"></span> Joanna Lee. All rights reserved.
      <div><button class="footer-admin" id="adminOpenBtn">관리자</button></div>
    </footer>
  </div>

  <!-- 응답 등록/수정 모달 -->
  <div class="overlay" id="entryOverlay">
    <div class="modal">
      <div class="pillar-tag" id="entryPillarTag"></div>
      <h3 id="entryModalTitle">의견 남기기</h3>
      <div class="error-msg" id="entryError"></div>
      <form id="entryForm">
        <div class="field">
          <label>소속(팀)</label>
          <input type="text" id="fTeam" maxlength="50" placeholder="예: SSC IT/Data팀" required>
        </div>
        <div class="field">
          <label>이름</label>
          <input type="text" id="fName" maxlength="50" placeholder="이름" required>
        </div>
        <div class="field">
          <label>이 요소가 중요한 이유</label>
          <textarea id="fReason" maxlength="300" placeholder="구체적인 이유를 남겨주세요" required></textarea>
          <div class="count"><span id="reasonCount">0</span>/300</div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-outline" id="entryCancelBtn">취소</button>
          <button type="submit" class="btn-primary" id="entrySubmitBtn">등록</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 관리자 모달 -->
  <div class="overlay" id="adminOverlay">
    <div class="modal">
      <h3>관리자</h3>
      <div class="error-msg" id="adminError"></div>
      <div class="field">
        <label>관리자 비밀번호</label>
        <input type="password" id="adminPw" placeholder="비밀번호 입력">
      </div>
      <p style="font-size:12.5px;color:var(--ink-soft);margin-top:-4px;">전체 삭제는 모든 팀의 응답을 영구적으로 지웁니다. 새로운 팀이 이어서 사용하기 전 초기화할 때만 사용하세요.</p>
      <div class="modal-actions">
        <button type="button" class="btn-outline" id="adminCancelBtn">취소</button>
        <button type="button" class="btn-danger" id="adminClearBtn">전체 삭제</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  var API = '/api/entries';
  var board = document.getElementById('board');
  var toastEl = document.getElementById('toast');
  var entries = [];
  var myToken = getToken();
  var activePillar = null;
  var editingId = null;

  function getToken() {
    var t = localStorage.getItem('za2030_token');
    if (!t) {
      t = (crypto.randomUUID ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2)));
      localStorage.setItem('za2030_token', t);
    }
    return t;
  }

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function pillarLabel(id) {
    var p = PILLARS.filter(function (x) { return x.id === id; })[0];
    return p ? p.en + ' (' + p.kr + ')' : id;
  }

  async function loadEntries() {
    try {
      var res = await fetch(API, { cache: 'no-store' });
      var data = await res.json().catch(function () { return null; });
      if (!res.ok) {
        var msg = (data && data.error) ? data.error : ('서버 오류 (' + res.status + ')');
        throw new Error(msg);
      }
      entries = Array.isArray(data) ? data : [];
    } catch (e) {
      entries = [];
      showToast('데이터를 불러오지 못했습니다: ' + (e && e.message ? e.message : '알 수 없는 오류'));
    }
    render();
  }

  function myEntry() {
    return entries.filter(function (e) { return e.token === myToken; })[0] || null;
  }

  function render() {
    board.innerHTML = '';
    var mine = myEntry();

    PILLARS.forEach(function (p) {
      var col = document.createElement('div');
      col.className = 'col';

      var list = entries.filter(function (e) { return e.pillar === p.id; })
        .sort(function (a, b) { return new Date(b.createdAt) - new Date(a.createdAt); });

      var addLabel = '+ 이 요소 선택하기';
      var addClass = 'add-btn btn-primary';
      if (mine) {
        if (mine.pillar === p.id) {
          addLabel = '내 의견 수정하기';
          addClass = 'add-btn mine';
        } else {
          addLabel = '이미 다른 요소에 참여함';
          addClass = 'add-btn btn-outline';
        }
      }

      col.innerHTML =
        '<div class="col-head">' +
          '<img class="icon" src="' + p.img + '" alt="' + p.en + ' icon">' +
          '<h2>' + p.en + '</h2>' +
          '<div class="kr">' + p.kr + '</div>' +
        '</div>' +
        '<div class="col-desc">' + escapeHtml(p.desc) + '</div>' +
        '<button class="' + addClass + '" data-pillar="' + p.id + '"' + ((mine && mine.pillar !== p.id) ? ' disabled' : '') + '>' + addLabel + '</button>' +
        '<div class="notes" id="notes-' + p.id + '"></div>';

      board.appendChild(col);

      var notesEl = col.querySelector('#notes-' + p.id);
      if (list.length === 0) {
        notesEl.innerHTML = '<div class="empty">아직 등록된 의견이 없습니다</div>';
      } else {
        list.forEach(function (e) {
          var isMine = e.token === myToken;
          var note = document.createElement('div');
          note.className = 'note' + (isMine ? ' mine' : '');
          note.innerHTML =
            '<div class="meta"><span class="who">' + escapeHtml(e.name) + '</span><span class="team">' + escapeHtml(e.team) + '</span></div>' +
            '<div class="reason">' + escapeHtml(e.reason) + '</div>' +
            (isMine ? '<div class="actions"><button class="btn-ghost" data-edit="' + e.id + '">수정</button><button class="btn-ghost" data-del="' + e.id + '">삭제</button></div>' : '');
          notesEl.appendChild(note);
        });
      }

      var addBtn = col.querySelector('.add-btn');
      addBtn.addEventListener('click', function () {
        if (mine && mine.pillar !== p.id) return;
        if (mine && mine.pillar === p.id) {
          openEntryModal(p.id, mine);
        } else {
          openEntryModal(p.id, null);
        }
      });
    });

    board.querySelectorAll('[data-edit]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-edit');
        var e = entries.filter(function (x) { return x.id === id; })[0];
        if (e) openEntryModal(e.pillar, e);
      });
    });
    board.querySelectorAll('[data-del]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-del');
        deleteEntry(id);
      });
    });
  }

  // ---- 등록/수정 모달 ----
  var entryOverlay = document.getElementById('entryOverlay');
  var entryForm = document.getElementById('entryForm');
  var fTeam = document.getElementById('fTeam');
  var fName = document.getElementById('fName');
  var fReason = document.getElementById('fReason');
  var reasonCount = document.getElementById('reasonCount');
  var entryError = document.getElementById('entryError');
  var entryPillarTag = document.getElementById('entryPillarTag');
  var entryModalTitle = document.getElementById('entryModalTitle');

  function openEntryModal(pillarId, existing) {
    activePillar = pillarId;
    editingId = existing ? existing.id : null;
    entryError.textContent = '';
    entryPillarTag.textContent = pillarLabel(pillarId);
    entryModalTitle.textContent = existing ? '내 의견 수정' : '의견 남기기';
    fTeam.value = existing ? existing.team : '';
    fName.value = existing ? existing.name : '';
    fReason.value = existing ? existing.reason : '';
    reasonCount.textContent = fReason.value.length;
    entryOverlay.classList.add('open');
    fTeam.focus();
  }
  function closeEntryModal() {
    entryOverlay.classList.remove('open');
  }
  document.getElementById('entryCancelBtn').addEventListener('click', closeEntryModal);
  entryOverlay.addEventListener('click', function (e) { if (e.target === entryOverlay) closeEntryModal(); });
  fReason.addEventListener('input', function () { reasonCount.textContent = fReason.value.length; });

  entryForm.addEventListener('submit', async function (e) {
    e.preventDefault();
    entryError.textContent = '';
    var team = fTeam.value.trim();
    var name = fName.value.trim();
    var reason = fReason.value.trim();
    if (!team || !name || !reason) {
      entryError.textContent = '모든 항목을 입력해 주세요.';
      return;
    }

    var submitBtn = document.getElementById('entrySubmitBtn');
    submitBtn.disabled = true;
    try {
      var res, data;
      if (editingId) {
        res = await fetch(API, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: editingId, token: myToken, team: team, name: name, reason: reason, pillar: activePillar })
        });
      } else {
        res = await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ team: team, name: name, reason: reason, pillar: activePillar, token: myToken })
        });
      }
      data = await res.json();
      if (!res.ok) {
        entryError.textContent = data.error || '처리 중 오류가 발생했습니다.';
        return;
      }
      closeEntryModal();
      showToast(editingId ? '수정되었습니다.' : '등록되었습니다.');
      await loadEntries();
    } catch (err) {
      entryError.textContent = '네트워크 오류가 발생했습니다.';
    } finally {
      submitBtn.disabled = false;
    }
  });

  async function deleteEntry(id) {
    if (!confirm('내 의견을 삭제할까요?')) return;
    try {
      var res = await fetch(API, {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: id, token: myToken })
      });
      var data = await res.json();
      if (!res.ok) {
        showToast(data.error || '삭제하지 못했습니다.');
        return;
      }
      showToast('삭제되었습니다.');
      await loadEntries();
    } catch (err) {
      showToast('네트워크 오류가 발생했습니다.');
    }
  }

  // ---- CSV 다운로드 ----
  document.getElementById('csvBtn').addEventListener('click', function () {
    if (entries.length === 0) {
      showToast('다운로드할 데이터가 없습니다.');
      return;
    }
    var header = ['소속(팀)', '이름', '선택 요소', '이유', '제출일시'];
    var rows = entries.map(function (e) {
      return [e.team, e.name, pillarLabel(e.pillar), e.reason, e.createdAt].map(csvCell).join(',');
    });
    var csv = '﻿' + header.join(',') + '\n' + rows.join('\n');
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'ZA2030_핵심요소_응답_' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });
  function csvCell(v) {
    var s = String(v == null ? '' : v).replace(/"/g, '""');
    return '"' + s + '"';
  }

  // ---- 관리자 ----
  var adminOverlay = document.getElementById('adminOverlay');
  var adminError = document.getElementById('adminError');
  var adminPw = document.getElementById('adminPw');
  document.getElementById('adminOpenBtn').addEventListener('click', function () {
    adminError.textContent = '';
    adminPw.value = '';
    adminOverlay.classList.add('open');
  });
  document.getElementById('adminCancelBtn').addEventListener('click', function () {
    adminOverlay.classList.remove('open');
  });
  adminOverlay.addEventListener('click', function (e) { if (e.target === adminOverlay) adminOverlay.classList.remove('open'); });

  document.getElementById('adminClearBtn').addEventListener('click', async function () {
    if (!adminPw.value) {
      adminError.textContent = '비밀번호를 입력해 주세요.';
      return;
    }
    if (!confirm('정말 모든 팀의 응답을 전체 삭제할까요? 이 작업은 되돌릴 수 없습니다.')) return;
    try {
      var res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'clear-all', adminPassword: adminPw.value })
      });
      var data = await res.json();
      if (!res.ok) {
        adminError.textContent = data.error || '삭제하지 못했습니다.';
        return;
      }
      adminOverlay.classList.remove('open');
      showToast('전체 삭제되었습니다.');
      await loadEntries();
    } catch (err) {
      adminError.textContent = '네트워크 오류가 발생했습니다.';
    }
  });

  document.getElementById('year').textContent = new Date().getFullYear();
  loadEntries();
})();
</script>
</body>
</html>
