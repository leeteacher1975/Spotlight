<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ZA2030 액션 아이템</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
<style>
  :root{
    --bg:#F5F8FC;
    --card:#FFFFFF;
    --ink:#1C2733;
    --ink-soft:#4B5768;
    --border:#DCE6F2;
    --accent:#1D4E89;
    --accent-strong:#12345E;
    --accent-tint:#E8F0FB;
    --danger:#D64545;
    --ok:#2E8B57;

    --customer:#2D6CDF;
    --speed:#E8871E;
    --global:#1FA179;
    --highperf:#8E44AD;

    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
    --shadow:0 6px 20px rgba(29,78,137,0.10);
    --shadow-sm:0 2px 8px rgba(29,78,137,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
    font-size:18px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1100px;margin:0 auto;padding:0 20px 60px;}

  header.top{
    background:linear-gradient(135deg,var(--accent) 0%,#2D6CDF 100%);
    color:#fff;
    padding:36px 20px 28px;
    border-radius:0 0 28px 28px;
    box-shadow:var(--shadow);
    margin-bottom:24px;
  }
  header.top .inner{max-width:1100px;margin:0 auto;}
  .zeiss-chip{
    display:inline-flex;align-items:center;gap:8px;
    background:rgba(255,255,255,0.16);
    border:1px solid rgba(255,255,255,0.35);
    padding:6px 14px;border-radius:999px;
    font-weight:700;font-size:14px;letter-spacing:0.04em;
    margin-bottom:14px;
  }
  header.top h1{font-size:clamp(26px,4vw,34px);margin:0 0 8px;font-weight:800;}
  header.top p{margin:0;font-size:17px;color:rgba(255,255,255,0.92);max-width:760px;}

  .flow-nav{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    margin:22px auto 0;max-width:1100px;padding:0 20px;
  }
  .flow-step{
    display:inline-flex;align-items:center;gap:8px;
    padding:10px 18px;border-radius:999px;border:2px solid var(--border);
    background:#fff;color:var(--ink-soft);text-decoration:none;
    font-weight:700;font-size:14.5px;transition:all .15s ease;
  }
  .flow-step .num{
    display:inline-flex;align-items:center;justify-content:center;
    width:22px;height:22px;border-radius:50%;background:var(--border);
    color:var(--ink-soft);font-size:12px;font-weight:800;
  }
  .flow-step.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .flow-step.active .num{background:rgba(255,255,255,.28);color:#fff;}
  .flow-step:hover{transform:translateY(-1px);}
  .flow-arrow{color:var(--border);font-weight:700;font-size:16px;}
  @media (max-width:640px){ .flow-nav{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;} .flow-step{flex:none;} }

  nav.tabs{
    display:flex;gap:10px;flex-wrap:wrap;
    margin:14px auto 0;max-width:1100px;padding:0 20px;
  }
  nav.tabs button{
    font-family:inherit;font-size:17px;font-weight:700;
    padding:13px 22px;border-radius:999px;border:2px solid var(--border);
    background:#fff;color:var(--accent);cursor:pointer;
    transition:all .15s ease;
  }
  nav.tabs button.active{
    background:var(--accent);color:#fff;border-color:var(--accent);
    box-shadow:var(--shadow-sm);
  }
  nav.tabs button:hover{transform:translateY(-1px);}
  nav.tabs .admin-btn{
    margin-left:auto;background:#fff;color:var(--ink-soft);border-color:var(--border);
    font-size:22px;padding:10px 16px;
  }

  section{display:none;}
  section.active{display:block;}

  /* ---- 작성 폼 ---- */
  .form-card{
    background:var(--card);border-radius:var(--radius-lg);
    box-shadow:var(--shadow);padding:32px;margin-top:24px;
    border:1px solid var(--border);
  }
  .quota-banner{
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
    background:var(--accent-tint);color:var(--accent-strong);
    border-radius:var(--radius-md);padding:16px 20px;margin-bottom:24px;
    font-weight:700;font-size:17px;
  }
  .quota-banner .count{font-size:20px;}
  label{display:block;font-weight:700;font-size:17px;margin:20px 0 8px;color:var(--ink);}
  label .req{color:var(--danger);margin-left:2px;}
  label .hint{display:block;font-weight:500;font-size:15px;color:var(--ink-soft);margin-top:3px;}
  input[type=text], textarea{
    width:100%;font-family:inherit;font-size:17px;color:var(--ink);
    padding:14px 16px;border-radius:var(--radius-sm);border:2px solid var(--border);
    background:#fff;resize:vertical;
  }
  input[type=text]:focus, textarea:focus{ outline:none;border-color:var(--accent); }
  textarea{min-height:88px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  @media (max-width:640px){.row2{grid-template-columns:1fr;}}
  .charcount{text-align:right;font-size:13px;color:var(--ink-soft);margin-top:4px;}

  .criteria-box{
    border:2px solid var(--border);border-radius:var(--radius-md);
    padding:16px 18px;margin-top:10px;background:#FBFDFF;
  }
  .criteria-box .cq{display:flex;align-items:flex-start;gap:12px;padding:8px 0;font-size:16px;}
  .criteria-box .cq:not(:last-child){border-bottom:1px dashed var(--border);}
  .criteria-box input[type=checkbox]{
    width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--accent);cursor:pointer;
  }
  .criteria-box .cq .label{cursor:pointer;}
  .criteria-box .cq .label b{display:block;font-size:16px;color:var(--ink);}
  .criteria-box .cq .label span{display:block;font-size:14px;color:var(--ink-soft);margin-top:2px;}

  .submit-btn{
    margin-top:26px;width:100%;padding:17px;border:none;border-radius:999px;
    background:var(--accent);color:#fff;font-size:19px;font-weight:800;
    cursor:pointer;box-shadow:var(--shadow-sm);
  }
  .submit-btn:disabled{background:#B9C6D6;cursor:not-allowed;}
  .submit-btn:hover:not(:disabled){background:var(--accent-strong);}
  .form-msg{margin-top:14px;font-weight:700;font-size:16px;}
  .form-msg.error{color:var(--danger);}
  .form-msg.ok{color:var(--ok);}

  .mine-wrap{margin-top:30px;}
  .mine-wrap h3{font-size:19px;margin-bottom:12px;}
  .mine-card{
    border:2px solid var(--border);border-radius:var(--radius-md);
    padding:16px 18px;margin-bottom:12px;display:flex;flex-wrap:wrap;justify-content:space-between;
    align-items:flex-start;gap:12px;background:#FBFDFF;
  }
  .mine-card .txt{flex:1;min-width:160px;}
  .mine-card .txt{font-size:16px;color:var(--ink-soft);}
  .mine-card .txt b{color:var(--ink);}
  .mine-del{
    border:none;background:var(--danger);color:#fff;border-radius:999px;
    padding:8px 16px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;
  }

  /* ---- 보드 ---- */
  .board-toolbar{
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;
    margin:24px 0 18px;
  }
  .board-toolbar .stats{font-size:17px;font-weight:700;color:var(--ink-soft);}
  .live-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ok);margin-right:8px;
    animation:pulse 1.6s infinite;}
  @keyframes pulse{0%{opacity:1;}50%{opacity:.35;}100%{opacity:1;}}
  .board-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .sort-btn, .csv-btn{
    border:2px solid var(--accent);background:#fff;color:var(--accent);
    font-weight:700;font-size:15px;padding:10px 18px;border-radius:999px;cursor:pointer;
  }
  .sort-btn.active{background:var(--accent);color:#fff;}
  .sort-btn:hover, .csv-btn:hover{background:var(--accent-tint);}
  .sort-btn.active:hover{background:var(--accent-strong);}

  .item-list{display:flex;flex-direction:column;gap:16px;}
  .empty-note{color:var(--ink-soft);font-size:16px;text-align:center;padding:40px 10px;}

  .item-card{
    background:var(--card);border:2px solid var(--border);border-radius:var(--radius-lg);
    box-shadow:var(--shadow-sm);padding:20px 22px;
  }
  .item-card .who{font-weight:800;font-size:16px;margin-bottom:6px;}
  .item-card .who .team{font-weight:600;color:var(--ink-soft);font-size:14px;}
  .item-card .action-text{font-size:19px;font-weight:700;color:var(--ink);margin:8px 0 14px;white-space:pre-wrap;word-break:break-word;}
  .crit-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .crit-chip{
    display:inline-flex;align-items:center;gap:6px;
    padding:7px 13px;border-radius:999px;font-size:14px;font-weight:700;
    border:2px solid var(--border);color:var(--ink-soft);background:#fff;
  }
  .crit-chip.met{background:var(--accent-tint);border-color:var(--accent);color:var(--accent-strong);}
  .card-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
  .all-met-badge{
    display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:800;
    color:var(--ok);
  }
  .like-btn{
    border:none;background:#fff;border-radius:999px;padding:9px 16px;
    font-weight:800;font-size:15px;cursor:pointer;box-shadow:var(--shadow-sm);
    color:var(--ink);border:2px solid var(--border);
  }
  .like-btn.liked{background:#FFE3E3;color:#D64545;border-color:#F6C6C6;}

  /* ---- admin modal ---- */
  .modal-backdrop{
    display:none;position:fixed;inset:0;background:rgba(20,30,45,0.55);
    align-items:center;justify-content:center;padding:20px;z-index:50;
  }
  .modal-backdrop.show{display:flex;}
  .modal{
    background:#fff;border-radius:var(--radius-lg);padding:28px;max-width:420px;width:100%;
    box-shadow:0 20px 50px rgba(0,0,0,0.25);
  }
  .modal h3{margin-top:0;font-size:21px;}
  .modal input{margin-top:8px;}
  .modal-actions{display:flex;gap:10px;margin-top:20px;}
  .modal-actions button{flex:1;padding:13px;border-radius:999px;font-weight:800;font-size:15px;border:none;cursor:pointer;}
  .btn-cancel{background:var(--border);color:var(--ink);}
  .btn-danger{background:var(--danger);color:#fff;}
  .modal-msg{margin-top:12px;font-size:14px;font-weight:700;color:var(--danger);}

  footer{
    text-align:center;color:var(--ink-soft);font-size:14px;margin-top:50px;padding-bottom:10px;
  }

  /* ---- 모바일 최적화 ---- */
  @media (max-width:480px){
    .wrap{padding:0 14px 40px;}
    header.top{padding:26px 16px 20px;border-radius:0 0 22px 22px;}
    header.top .inner{padding:0;}
    .zeiss-chip{font-size:12.5px;padding:5px 11px;}
    header.top h1{font-size:24px;}
    header.top p{font-size:15px;}
    .flow-nav, nav.tabs{padding:0 14px;}
    .flow-step{padding:9px 14px;font-size:13.5px;}
    nav.tabs button{padding:11px 16px;font-size:15.5px;}
    nav.tabs .admin-btn{margin-left:0;}
    .form-card{padding:20px 16px;}
    .row2{gap:14px;}
    .criteria-box{padding:14px 15px;}
    .modal{padding:18px;}
    .item-card{padding:16px 15px;}
    .mine-card{padding:13px 14px;}
    .quota-banner{padding:14px 16px;font-size:15.5px;}
  }
  button, select { min-height:44px; }
  .like-btn, .mine-del, .sort-btn, .csv-btn { min-height:38px; }
</style>
</head>
<body>
<header class="top">
  <div class="inner">
    <span class="zeiss-chip">ZEISS · ZA2030</span>
    <h1>액션 아이템 — 우리 팀이 다음에 할 일</h1>
    <p>오늘 나눈 이야기를 바탕으로, 우리 팀이 실제로 가져갈 액션 1~2개를 제안해주세요.</p>
  </div>
</header>

<nav class="flow-nav" aria-label="세션 진행 순서">
  <a href="index.html" class="flow-step"><span class="num">1</span>핵심 요소</a>
  <span class="flow-arrow">→</span>
  <a href="evidence-hunt.html" class="flow-step"><span class="num">2</span>Evidence Hunt</a>
  <span class="flow-arrow">→</span>
  <a href="action-items.html" class="flow-step active"><span class="num">3</span>액션 아이템</a>
</nav>

<nav class="tabs">
  <button id="tabWriteBtn" class="active">✍️ 액션 제안하기</button>
  <button id="tabBoardBtn">📋 함께 보기</button>
  <button id="adminBtn" class="admin-btn" title="관리자">⚙️</button>
</nav>

<div class="wrap">
  <!-- 작성 -->
  <section id="writeView" class="active">
    <div class="form-card">
      <div class="quota-banner">
        <span>내가 제안한 액션</span>
        <span class="count" id="quotaCount">0 / 2</span>
      </div>

      <form id="entryForm">
        <div class="row2">
          <div>
            <label>이름<span class="req">*</span></label>
            <input type="text" id="fName" maxlength="40" required placeholder="예: 이지영" />
          </div>
          <div>
            <label>소속(팀)<span class="req">*</span></label>
            <input type="text" id="fTeam" maxlength="40" required placeholder="예: SSC IT/Data팀" />
          </div>
        </div>

        <label>우리 팀이 다음에 할 액션<span class="req">*</span>
          <span class="hint">1~2개 중 하나를 구체적으로 적어주세요.</span>
        </label>
        <textarea id="fAction" maxlength="300" required placeholder="예: 월간 팀 회의에 '솔직한 피드백 5분' 코너를 신설한다."></textarea>
        <div class="charcount"><span id="cAction">0</span>/300</div>

        <label>이 액션은 —</label>
        <div class="criteria-box">
          <label class="cq" for="cImpact">
            <input type="checkbox" id="cImpact" />
            <span class="label"><b>Impact — 의미 있는가?</b><span>이 액션이 실제로 의미 있는 변화를 만든다고 생각해요.</span></span>
          </label>
          <label class="cq" for="cControl">
            <input type="checkbox" id="cControl" />
            <span class="label"><b>Control — 우리가 바꿀 수 있는가?</b><span>우리 팀의 권한과 노력으로 실행할 수 있어요.</span></span>
          </label>
          <label class="cq" for="cFeasibility">
            <input type="checkbox" id="cFeasibility" />
            <span class="label"><b>Feasibility — 실제로 할 수 있는가?</b><span>현재 자원과 시간 내에서 실행 가능해요.</span></span>
          </label>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">액션 제안하기</button>
        <div class="form-msg" id="formMsg"></div>
      </form>

      <div class="mine-wrap" id="mineWrap" style="display:none;">
        <h3>내가 제안한 액션</h3>
        <div id="mineList"></div>
      </div>
    </div>
  </section>

  <!-- 보드 -->
  <section id="boardView">
    <div class="board-toolbar">
      <div class="stats"><span class="live-dot"></span><span id="statsText">불러오는 중…</span></div>
      <div class="board-actions">
        <button class="sort-btn active" id="sortRecentBtn">최신순</button>
        <button class="sort-btn" id="sortLikesBtn">공감순</button>
        <button class="csv-btn" id="csvBtn">⬇ CSV 다운로드</button>
      </div>
    </div>
    <div class="item-list" id="itemList"></div>
  </section>
</div>

<footer>© 2026 Joanna Lee. All rights reserved.</footer>

<!-- 관리자 모달 -->
<div class="modal-backdrop" id="adminModal">
  <div class="modal">
    <h3>⚙️ 관리자</h3>
    <label>관리자 비밀번호</label>
    <input type="text" id="adminPw" placeholder="비밀번호 입력" />
    <div class="modal-actions">
      <button class="btn-cancel" id="adminCancel">닫기</button>
      <button class="btn-danger" id="adminClearAll">전체 삭제</button>
    </div>
    <div class="modal-msg" id="adminMsg"></div>
  </div>
</div>

<script>
(function(){
  const API = '/api/action-items';

  // device token
  let deviceToken = localStorage.getItem('za2030_ai_token');
  if(!deviceToken){
    deviceToken = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random());
    localStorage.setItem('za2030_ai_token', deviceToken);
  }
  let likedIds = JSON.parse(localStorage.getItem('za2030_ai_liked') || '[]');
  function saveLiked(){ localStorage.setItem('za2030_ai_liked', JSON.stringify(likedIds)); }

  // ---- tabs ----
  const tabWriteBtn = document.getElementById('tabWriteBtn');
  const tabBoardBtn = document.getElementById('tabBoardBtn');
  const writeView = document.getElementById('writeView');
  const boardView = document.getElementById('boardView');
  let pollTimer = null;
  let sortMode = 'recent'; // 'recent' | 'likes'

  function showWrite(){
    tabWriteBtn.classList.add('active'); tabBoardBtn.classList.remove('active');
    writeView.classList.add('active'); boardView.classList.remove('active');
    stopPolling();
    refreshMine();
  }
  function showBoard(){
    tabBoardBtn.classList.add('active'); tabWriteBtn.classList.remove('active');
    boardView.classList.add('active'); writeView.classList.remove('active');
    loadBoard();
    startPolling();
  }
  tabWriteBtn.addEventListener('click', showWrite);
  tabBoardBtn.addEventListener('click', showBoard);

  function startPolling(){
    stopPolling();
    pollTimer = setInterval(()=>{ if(!document.hidden) loadBoard(); }, 2000);
  }
  function stopPolling(){ if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }
  document.addEventListener('visibilitychange', ()=>{
    if(!document.hidden && boardView.classList.contains('active')) loadBoard();
  });

  document.getElementById('sortRecentBtn').addEventListener('click', ()=>{
    sortMode = 'recent';
    document.getElementById('sortRecentBtn').classList.add('active');
    document.getElementById('sortLikesBtn').classList.remove('active');
    renderBoard(allEntriesCache);
  });
  document.getElementById('sortLikesBtn').addEventListener('click', ()=>{
    sortMode = 'likes';
    document.getElementById('sortLikesBtn').classList.add('active');
    document.getElementById('sortRecentBtn').classList.remove('active');
    renderBoard(allEntriesCache);
  });

  // char counter
  const fAction = document.getElementById('fAction');
  const cAction = document.getElementById('cAction');
  fAction.addEventListener('input', ()=>{ cAction.textContent = fAction.value.length; });

  function escapeHtml(str){
    return (str||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---- fetch all (shared) ----
  let allEntriesCache = [];
  async function fetchAll(){
    const res = await fetch(API, { method:'GET' });
    if(!res.ok) throw new Error('load failed');
    allEntriesCache = await res.json();
    return allEntriesCache;
  }

  // ---- mine / quota ----
  const quotaCount = document.getElementById('quotaCount');
  const submitBtn = document.getElementById('submitBtn');
  const mineWrap = document.getElementById('mineWrap');
  const mineList = document.getElementById('mineList');

  async function refreshMine(){
    try{
      const entries = await fetchAll();
      const mine = entries.filter(e=>e.deviceToken===deviceToken);
      quotaCount.textContent = mine.length + ' / 2';
      submitBtn.disabled = mine.length >= 2;
      submitBtn.textContent = mine.length >= 2 ? '이미 2건을 제안했습니다' : '액션 제안하기';
      if(mine.length){
        mineWrap.style.display='block';
        mineList.innerHTML = mine.map(e=>{
          return `<div class="mine-card">
            <div class="txt"><b>${escapeHtml(e.actionText)}</b></div>
            <button class="mine-del" data-id="${e.id}">삭제</button>
          </div>`;
        }).join('');
        mineList.querySelectorAll('.mine-del').forEach(btn=>{
          btn.addEventListener('click', async ()=>{
            btn.disabled = true;
            await fetch(API, { method:'DELETE', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ id: btn.dataset.id, deviceToken }) });
            refreshMine();
          });
        });
      } else {
        mineWrap.style.display='none';
      }
    }catch(err){ console.error(err); }
  }

  // ---- submit ----
  const formMsg = document.getElementById('formMsg');
  document.getElementById('entryForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    formMsg.textContent=''; formMsg.className='form-msg';
    const payload = {
      name: document.getElementById('fName').value,
      team: document.getElementById('fTeam').value,
      actionText: fAction.value,
      impact: document.getElementById('cImpact').checked,
      control: document.getElementById('cControl').checked,
      feasibility: document.getElementById('cFeasibility').checked,
      deviceToken,
    };
    if(!payload.name.trim() || !payload.team.trim() || !payload.actionText.trim()){
      formMsg.textContent = '이름, 소속, 액션 내용은 필수입니다.'; formMsg.classList.add('error'); return;
    }
    submitBtn.disabled = true;
    try{
      const res = await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
      const data = await res.json();
      if(!res.ok){ throw new Error(data.error || '제출 실패'); }
      formMsg.textContent = '제안되었습니다. 감사합니다!'; formMsg.classList.add('ok');
      document.getElementById('entryForm').reset();
      cAction.textContent = '0';
      refreshMine();
    }catch(err){
      formMsg.textContent = err.message || '오류가 발생했습니다.'; formMsg.classList.add('error');
      submitBtn.disabled = false;
    }
  });

  // ---- board ----
  const itemList = document.getElementById('itemList');
  const statsText = document.getElementById('statsText');

  function renderBoard(entries){
    entries = entries || [];
    const total = entries.length;
    const people = new Set(entries.map(e=>e.deviceToken)).size;
    statsText.textContent = `총 ${total}건 · 참여 ${people}명`;

    const sorted = entries.slice().sort((a,b)=>{
      if(sortMode === 'likes'){
        const diff = (b.likes||0) - (a.likes||0);
        if(diff !== 0) return diff;
      }
      return new Date(b.createdAt) - new Date(a.createdAt);
    });

    if(sorted.length === 0){
      itemList.innerHTML = `<div class="empty-note">아직 제안된 액션이 없습니다.</div>`;
      return;
    }

    itemList.innerHTML = sorted.map(e=>{
      const liked = likedIds.includes(e.id);
      const allMet = e.impact && e.control && e.feasibility;
      return `<div class="item-card">
        <div class="who">${escapeHtml(e.name)} <span class="team">· ${escapeHtml(e.team)}</span></div>
        <div class="action-text">${escapeHtml(e.actionText)}</div>
        <div class="crit-row">
          <span class="crit-chip ${e.impact?'met':''}">${e.impact?'✅':'⬜'} Impact</span>
          <span class="crit-chip ${e.control?'met':''}">${e.control?'✅':'⬜'} Control</span>
          <span class="crit-chip ${e.feasibility?'met':''}">${e.feasibility?'✅':'⬜'} Feasibility</span>
        </div>
        <div class="card-foot">
          <span class="all-met-badge">${allMet ? '🏆 3개 기준 모두 충족' : ''}</span>
          <button class="like-btn ${liked?'liked':''}" data-id="${e.id}">${liked?'❤️':'🤍'} 공감 ${e.likes||0}</button>
        </div>
      </div>`;
    }).join('');

    itemList.querySelectorAll('.like-btn').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const id = btn.dataset.id;
        const isLiked = likedIds.includes(id);
        const action = isLiked ? 'unlike' : 'like';
        btn.disabled = true;
        try{
          const res = await fetch(API, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ id, deviceToken, action }) });
          if(res.ok){
            if(isLiked){ likedIds = likedIds.filter(x=>x!==id); } else { likedIds.push(id); }
            saveLiked();
            loadBoard();
          }
        }catch(err){ console.error(err); }
        btn.disabled = false;
      });
    });
  }

  async function loadBoard(){
    try{
      const entries = await fetchAll();
      renderBoard(entries);
    }catch(err){
      statsText.textContent = '불러오기 실패 — 잠시 후 다시 시도합니다.';
    }
  }

  // ---- CSV ----
  document.getElementById('csvBtn').addEventListener('click', async ()=>{
    try{
      const entries = await fetchAll();
      const header = ['소속','이름','액션 아이템','Impact','Control','Feasibility','공감수','제출일시'];
      const rows = entries.map(e=>{
        return [e.team, e.name, e.actionText, e.impact?'Y':'N', e.control?'Y':'N', e.feasibility?'Y':'N', e.likes||0, e.createdAt]
          .map(v => '"' + String(v).replace(/"/g,'""') + '"').join(',');
      });
      const csv = '﻿' + [header.join(','), ...rows].join('\r\n');
      const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'za2030_action_items.csv';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }catch(err){ alert('CSV 다운로드에 실패했습니다.'); }
  });

  // ---- admin ----
  const adminModal = document.getElementById('adminModal');
  const adminMsg = document.getElementById('adminMsg');
  document.getElementById('adminBtn').addEventListener('click', ()=>{
    adminMsg.textContent=''; document.getElementById('adminPw').value='';
    adminModal.classList.add('show');
  });
  document.getElementById('adminCancel').addEventListener('click', ()=> adminModal.classList.remove('show'));
  adminModal.addEventListener('click', (e)=>{ if(e.target===adminModal) adminModal.classList.remove('show'); });
  document.getElementById('adminClearAll').addEventListener('click', async ()=>{
    const pw = document.getElementById('adminPw').value;
    if(!pw){ adminMsg.textContent='비밀번호를 입력해주세요.'; return; }
    if(!confirm('정말 모든 액션 제안을 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.')) return;
    try{
      const res = await fetch(API, { method:'DELETE', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ adminToken: pw }) });
      const data = await res.json();
      if(!res.ok){ adminMsg.textContent = data.error || '삭제 실패'; return; }
      adminMsg.textContent = ''; adminModal.classList.remove('show');
      loadBoard(); refreshMine();
    }catch(err){ adminMsg.textContent = '오류가 발생했습니다.'; }
  });

  // init
  refreshMine();
})();
</script>
</body>
</html>
